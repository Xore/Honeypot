name: Malware Analysis Pipeline

on:
  push:
    paths:
      - 'samples/**'
  workflow_dispatch:
    inputs:
      sample_path:
        description: 'Path to sample file (e.g. samples/ELF/myfile)'
        required: false

jobs:
  analyze:
    name: Submit & Report
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests vt-py weasyprint jinja2 python-dateutil

      - name: Find new samples
        id: find_samples
        run: |
          # Get files added/modified in this push
          git diff --name-only HEAD~1 HEAD -- 'samples/' > /tmp/changed_files.txt || \
            find samples/ -type f ! -name '.gitkeep' > /tmp/changed_files.txt
          echo "Changed files:"
          cat /tmp/changed_files.txt
          echo "count=$(wc -l < /tmp/changed_files.txt)" >> $GITHUB_OUTPUT

      - name: Run analysis pipeline
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          JOESANDBOX_API_KEY: ${{ secrets.JOESANDBOX_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/analyze_samples.py --file-list /tmp/changed_files.txt

      - name: Commit reports and IOC updates
        run: |
          git config user.name  "honeypot-bot"
          git config user.email "honeypot-bot@noreply.github.com"
          git add reports/ iocs/
          git diff --cached --quiet || git commit -m "bot: add analysis reports [skip ci]"
          git push
