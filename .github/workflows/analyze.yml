# analyze.yml — Xore/Honeypot multi-scanner pipeline
#
# Failure contract:
#   - A single scanner API failure never aborts the job.
#   - The JSON report is ALWAYS written and committed.
#   - Hard fail (exit 1) only when:
#       a) No scanner API key secrets are set at all
#       b) File list cannot be read
#       c) Every scanner errored on every file (exit 2)
#       d) A checked-in YARA rule does not compile
#   - Deleted files are NEVER scanned (--diff-filter=AR)
#   - Deletion-only or structural-only pushes skip the entire job immediately.
#   - Only genuinely new (Added) or renamed (Renamed) sample files are scanned.
#     Modified files are intentionally excluded: a file that already exists in
#     samples/ was already scanned on the commit that Added it. Re-scanning on
#     every structural commit (scaffolding, .gitkeep, workflow changes) would
#     cause redundant uploads — the root cause of the dashboard.exe re-scan.
#   - PRs trigger analysis but never commit results (dry-run mode).
#   - Scheduled runs rescan all of samples/ with fresh API scores.
#   - generate_yara.py runs after each scan and auto-generates YARA rules
#     from scan results into yara-rules/auto/. Failures are non-fatal.
#
# Sample layout:
#   samples/ELF/       Linux/IoT ELF binaries
#   samples/PE/        Windows PE executables
#   samples/Scripts/   Dropper scripts
#   samples/Docs/      Malicious documents
#   samples/Miori/     Miori botnet samples
#   samples/UNKNOWN/   Unclassified
#
# Action SHA pins (update periodically):
#   actions/checkout        v4  → 11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-python    v7  → 5fda3b95a4ea91299a34e894583c3862153e4b97
#   actions/cache           v4  → 5a3ec84eff668545956fd18022155c47e93e2684
#   actions/upload-artifact v4  → ea165f8d65b6e75b540449e92b4886f43607fa02

name: Malware Analysis Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'samples/**'
      - 'yara-rules/**'
      - '.github/workflows/analyze.yml'
  pull_request:
    branches: [main]
    paths:
      - 'samples/**'
      - 'yara-rules/**'
      - '.github/workflows/analyze.yml'
  schedule:
    # Weekly rescan every Sunday at 02:00 UTC — catches improved detections
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      sample_path:
        description: 'File or directory to scan (e.g. samples/PE/evil.exe or samples/)'
        required: false
        default: 'samples/'

# Minimal top-level permissions; write granted only at job level where needed
permissions:
  contents: read

jobs:
  analyze:
    name: Submit & Report
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Grant write only to this job (not the whole workflow)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        # actions/checkout v4 — pinned SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # fetch-depth 0 for scheduled full rescan; 2 for push/PR diffs
          fetch-depth: ${{ github.event_name == 'schedule' && '0' || '2' }}
          token: ${{ secrets.GH_PAT }}

      - name: Skip if no new sample files
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        run: |
          set -euo pipefail
          ADDED=$(git diff --name-only --diff-filter=AR HEAD~1 HEAD \
            -- 'samples/' 2>/dev/null \
            | grep -v '\.gitkeep$' | wc -l \
            || git ls-files samples/ | grep -v '\.gitkeep$' | wc -l)
          if [ "$ADDED" -eq 0 ]; then
            echo "No new sample files in this push — skipping pipeline."
            exit 0
          fi
          echo "$ADDED new sample file(s) detected — continuing."

      - name: Set up Python
        # actions/setup-python v7 — pinned SHA
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        # actions/cache v4 — pinned SHA
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}-v1
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Fix apt archives ownership
        # A previous run's `apt-get install` (via sudo) leaves cached .debs
        # root:root. actions/cache's restore step extracts as the unprivileged
        # runner user, so overwriting those files fails with "Permission
        # denied" and the whole restore aborts (cache silently treated as a
        # miss). Reset ownership before restore runs so extraction succeeds.
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt packages
        # Cache only the downloaded .deb files, not the lock/partial dirs
        # which are owned by root and cannot be archived by the runner user.
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ runner.os }}-apt-honeypot-v2

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install --quiet \
            requests vt-py python-magic pyzipper py7zr rarfile \
            weasyprint jinja2 python-dateutil yara-python
          sudo apt-get install -qq -y \
            p7zip-full libmagic1 \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            fonts-dejavu-core yara binutils

      - name: Validate YARA rules
        run: bash .github/scripts/validate_yara.sh

      - name: Test YARA rule generator
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'

      - name: Detect changed sample files
        id: find_samples
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.sample_path }}"
            if [ -f "$TARGET" ]; then
              echo "$TARGET" > /tmp/changed_files.txt
            else
              find "$TARGET" -type f 2>/dev/null \
                | grep -v '\.gitkeep$' > /tmp/changed_files.txt || true
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            find samples/ -type f | grep -v '\.gitkeep$' > /tmp/changed_files.txt || true
          else
            git diff --name-only --diff-filter=AR HEAD~1 HEAD \
              -- 'samples/' \
              | grep -v '/$' \
              | grep -v '\.gitkeep$' \
              > /tmp/changed_files.txt 2>/dev/null \
              || find samples/ -type f | grep -v '\.gitkeep$' > /tmp/changed_files.txt || true
          fi

          if [ -f /tmp/changed_files.txt ]; then
            while IFS= read -r line; do
              [ -f "$line" ] && echo "$line"
            done < /tmp/changed_files.txt > /tmp/existing_files.txt
            mv /tmp/existing_files.txt /tmp/changed_files.txt
          fi

          echo "=== Files to scan ==="
          cat /tmp/changed_files.txt || true
          COUNT=$(wc -l < /tmp/changed_files.txt || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: YARA local pre-scan
        id: yara
        if: steps.find_samples.outputs.count != '0'
        # Non-fatal like generate_yara.py below: a bug in this pre-scan
        # (e.g. the grep/-gt cascade fixed 2026-07-26) must not skip the
        # actual scanner analysis, PDF report, and commit steps that follow.
        continue-on-error: true
        run: |
          set -euo pipefail
          YARA_HITS=0
          # Scan both hand-crafted and auto-generated rules
          RULE_FILES=$(find yara-rules/ -name '*.yar' -o -name '*.yara' 2>/dev/null | grep -v '_invalid' | wc -l)
          if [ "$RULE_FILES" -eq 0 ]; then
            echo "No YARA rules found — skipping local scan."
            echo "yara_hits=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p reports/yara
          REPORT="reports/yara/yara-$(date +%Y-%m-%d-%H%M%S).txt"
          while IFS= read -r sample; do
            [ -f "$sample" ] || continue
            find yara-rules/ -name '*.yar' -o -name '*.yara' 2>/dev/null \
              | grep -v '_invalid' \
              | while read -r rulefile; do
                  yara "$rulefile" "$sample" 2>/dev/null >> "$REPORT" || true
                done
          done < /tmp/changed_files.txt
          # `grep -c` prints "0" AND exits 1 when there are no matches, so a
          # `|| echo 0` fallback double-counts (YARA_HITS becomes "0\n0",
          # which then blows up the `-gt` integer comparison below). Let
          # grep's own count stand and only fall back if it errored outright.
          YARA_HITS=$(grep -c '.' "$REPORT" 2>/dev/null) || YARA_HITS=0
          echo "YARA hits: $YARA_HITS"
          echo "yara_hits=$YARA_HITS" >> "$GITHUB_OUTPUT"
          if [ "$YARA_HITS" -gt 0 ]; then
            echo "::warning::YARA matched $YARA_HITS rule(s) — see reports/yara/ for details."
          fi

      - name: Run multi-scanner analysis
        id: scanner
        if: steps.find_samples.outputs.count != '0'
        env:
          VT_API_KEY:            ${{ secrets.VT_API_KEY }}
          MALWAREBAZAAR_API_KEY: ${{ secrets.MALWAREBAZAAR_API_KEY }}
          HYBRID_ANALYSIS_KEY:   ${{ secrets.HYBRID_ANALYSIS_KEY }}
          MALSHARE_API_KEY:      ${{ secrets.MALSHARE_API_KEY }}
          JOESANDBOX_API_KEY:    ${{ secrets.JOESANDBOX_API_KEY }}
          METADEFENDER_API_KEY:  ${{ secrets.METADEFENDER_API_KEY }}
          CAPE_API_URL:          ${{ secrets.CAPE_API_URL }}
          CAPE_API_KEY:          ${{ secrets.CAPE_API_KEY }}
          ANYRUN_API_KEY:        ${{ secrets.ANYRUN_API_KEY }}
          GITHUB_REPO:           ${{ github.repository }}
        run: |
          touch /tmp/honeypot-scan-start
          python3 .github/scripts/analyze_samples.py \
            --file-list /tmp/changed_files.txt \
            --output-dir reports/scanner/ \
            --ioc-dir iocs/ \
            --archive-passwords infected,malware,infected123,virus \
            --wait-results
          SCAN_EXIT=$?
          echo "scan_exit=$SCAN_EXIT" >> "$GITHUB_OUTPUT"
          if [ "$SCAN_EXIT" -eq 1 ]; then
            echo "::error::No scanner API keys configured. Add at least VT_API_KEY."
            exit 1
          fi
          if [ "$SCAN_EXIT" -eq 2 ]; then
            echo "::error::All scanners failed on all files. Check API keys/network."
            exit 2
          fi
          exit 0

      - name: Wait for queued analysis reports
        if: always() && steps.find_samples.outputs.count != '0'
        env:
          VT_API_KEY:             ${{ secrets.VT_API_KEY }}
          MALWAREBAZAAR_API_KEY:  ${{ secrets.MALWAREBAZAAR_API_KEY }}
          HYBRID_ANALYSIS_KEY:    ${{ secrets.HYBRID_ANALYSIS_KEY }}
          METADEFENDER_API_KEY:   ${{ secrets.METADEFENDER_API_KEY }}
        run: |
          python3 .github/scripts/wait_for_reports.py \
            --report-dir reports/scanner/ \
            --newer-than /tmp/honeypot-scan-start \
            --timeout-seconds 1200 \
            --interval-seconds 30

      - name: Generate YARA rules from scan results
        # Runs after scanner. Generator exceptions remain non-fatal so reports
        # survive, but the post-generation compile gate below rejects invalid
        # active rules and keeps them out of the bot commit.
        # Reads reports/scanner/*.json, extracts strings from sample binaries,
        # emits rules to yara-rules/auto/<family>.yar.
        # New rules are then automatically picked up by the next YARA pre-scan.
        id: yara_gen
        if: steps.find_samples.outputs.count != '0'
        run: |
          set -uo pipefail
          OUTPUT=$(python3 .github/scripts/generate_yara.py \
            --report-dir reports/scanner/ \
            --sample-dir samples/ \
            --output-dir yara-rules/auto/ 2>&1) || true
          echo "$OUTPUT"
          NEW=$(echo "$OUTPUT"   | grep '^new_rules='     | cut -d= -f2 || echo 0)
          UPD=$(echo "$OUTPUT"   | grep '^updated_rules=' | cut -d= -f2 || echo 0)
          echo "yara_new=$NEW"     >> "$GITHUB_OUTPUT"
          echo "yara_updated=$UPD" >> "$GITHUB_OUTPUT"
          echo "::notice::YARA rule generation: $NEW new, $UPD updated"

      - name: Validate generated YARA rules
        id: yara_postcheck
        if: steps.find_samples.outputs.count != '0'
        continue-on-error: true
        run: bash .github/scripts/validate_yara.sh

      - name: Update IOC changelog
        if: steps.find_samples.outputs.count != '0'
        run: |
          set -euo pipefail
          mkdir -p iocs
          CHANGELOG="iocs/CHANGELOG.md"
          [ -f "$CHANGELOG" ] || echo "# IOC Changelog" > "$CHANGELOG"
          DATE=$(date +%Y-%m-%d)
          NEW_IOCS=$(find iocs/ -name '*.txt' -newer "$CHANGELOG" 2>/dev/null | wc -l || echo 0)
          printf "\n## %s\n- New IOC files: %s\n- YARA rules generated: %s new, %s updated\n- Triggered by: %s (%s)\n" \
            "$DATE" "$NEW_IOCS" \
            "${{ steps.yara_gen.outputs.yara_new }}" \
            "${{ steps.yara_gen.outputs.yara_updated }}" \
            "${{ github.event_name }}" "${{ github.sha }}" \
            >> "$CHANGELOG"

      - name: Generate PDF report
        id: pdf
        if: always() && steps.find_samples.outputs.count != '0'
        env:
          GITHUB_REPO:   ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          DATE=$(date +%Y-%m-%d)
          PDF="reports/pdf/scan-report-${DATE}.pdf"
          mkdir -p reports/pdf
          python3 .github/scripts/report.py \
            --input-dir reports/scanner/ \
            --output    "$PDF" \
            --newer-than /tmp/honeypot-scan-start
          echo "pdf_path=$PDF" >> "$GITHUB_OUTPUT"

      - name: Upload PDF as artifact
        if: always() && steps.find_samples.outputs.count != '0'
        # actions/upload-artifact v4 — pinned SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scan-report-${{ github.run_id }}
          path: |
            reports/pdf/scan-report-*.pdf
            reports/pdf/samples/*.pdf
          retention-days: 90
          if-no-files-found: warn

      - name: Commit reports, IOC updates and YARA rules
        # Skip commit on PRs (dry-run mode)
        # Commits: reports/ + iocs/ + yara-rules/auto/
        if: always() && steps.find_samples.outputs.count != '0' && github.event_name != 'pull_request'
        run: |
          git config user.name  "honeypot-bot"
          git config user.email "honeypot-bot@noreply.github.com"
          if [ "${{ steps.yara_postcheck.outcome }}" = "success" ]; then
            git add reports/ iocs/ yara-rules/auto/ 2>/dev/null || true
          else
            echo "::error::Generated YARA validation failed; committing reports and IOCs only."
            git add reports/ iocs/ 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            YARA_NEW="${{ steps.yara_gen.outputs.yara_new }}"
            YARA_UPD="${{ steps.yara_gen.outputs.yara_updated }}"
            git commit -m "bot: scanner results $(date +%Y-%m-%d) | yara +${YARA_NEW} ~${YARA_UPD} [skip ci]"
            git push
          fi

      - name: Fail on invalid generated YARA
        if: always() && steps.yara_postcheck.outcome == 'failure'
        run: exit 1

      - name: Job summary
        if: always()
        run: |
          if [ "${{ steps.find_samples.outputs.count }}" = "0" ] || [ -z "${{ steps.find_samples.outputs.count }}" ]; then
            echo "## Malware Analysis Pipeline" >> "$GITHUB_STEP_SUMMARY"
            echo "ℹ️ No new sample files detected in this run." >> "$GITHUB_STEP_SUMMARY"
            echo "- Trigger: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            python3 .github/scripts/summary.py reports/scanner/ >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### YARA Pre-Scan" >> "$GITHUB_STEP_SUMMARY"
            echo "- Local rule hits: \`${{ steps.yara.outputs.yara_hits }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Auto-Generated YARA Rules" >> "$GITHUB_STEP_SUMMARY"
            echo "- New rules:     \`${{ steps.yara_gen.outputs.yara_new }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Updated rules: \`${{ steps.yara_gen.outputs.yara_updated }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Location: \`yara-rules/auto/\`" >> "$GITHUB_STEP_SUMMARY"
          fi
